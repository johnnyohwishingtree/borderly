name: 'Setup Node and pnpm'
description: 'Install Node.js 20, pnpm, and project dependencies'

inputs:
  frozen_lockfile:
    description: 'Require frozen lockfile (falls back to no-frozen if fails)'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install pnpm
      shell: bash
      run: npm install -g pnpm

    - name: Install dependencies
      shell: bash
      run: |
        if [ "${{ inputs.frozen_lockfile }}" = "true" ]; then
          pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
        else
          pnpm install --no-frozen-lockfile
        fi
