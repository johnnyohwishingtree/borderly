name: Screenshot Capture

# Captures screenshots after merges that touch UI files.
# Tries Android emulator first (native fidelity), falls back to Playwright
# if emulator fails. Creates a PR if screenshots changed.
#
# Runs post-merge only — never blocks PRs.

on:
  push:
    branches: [master]
    paths:
      - 'src/screens/**'
      - 'src/components/**'
      - 'src/schemas/**'
      - 'src/app/navigation/**'
      - 'e2e/tests/captureScreenshots.spec.ts'
      - 'maestro/flows/capture-screenshots.yaml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node

      - name: Setup pipeline TypeScript
        uses: ./.github/actions/setup-pipeline-ts

      - name: Try Android emulator capture
        id: android
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            curl -Ls "https://get.maestro.mobile.dev" | bash
            export PATH="$PATH:$HOME/.maestro/bin"

            cd android && ./gradlew assembleDebug -PreactNativeArchitectures=x86_64 && cd ..
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            sleep 5

            maestro test maestro/flows/capture-screenshots.yaml \
              --output maestro/output/ \
              --format junit

            if ls maestro/output/*.png 1>/dev/null 2>&1; then
              cp maestro/output/*.png e2e/screenshots/
              echo "ANDROID_SCREENSHOTS=true" >> $GITHUB_ENV
            fi

      - name: Fallback to Playwright capture
        if: steps.android.outcome == 'failure' || env.ANDROID_SCREENSHOTS != 'true'
        run: |
          echo "Android emulator failed — falling back to Playwright"
          npx webpack --config webpack.config.js --mode production
          E2E_PROJECT=screenshot-capture npx playwright test captureScreenshots \
            --project=screenshot-capture --workers=1 || true

      - name: Update flow graph
        run: npx tsx e2e/scripts/generate-flow-graph.ts

      - name: Check for changes
        id: diff
        run: |
          git add e2e/screenshots/
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            CHANGED_FILES=$(git diff --cached --name-only | wc -l | tr -d ' ')
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "changed_count=$CHANGED_FILES" >> $GITHUB_OUTPUT
          fi

      - name: Create PR with updated screenshots
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          SOURCE="Android emulator (Maestro)"
          if [ "${{ steps.android.outcome }}" = "failure" ] || [ "$ANDROID_SCREENSHOTS" != "true" ]; then
            SOURCE="Playwright (Android emulator unavailable)"
          fi

          BRANCH="chore/update-screenshots-$(date +%Y%m%d-%H%M)"
          npx tsx .github/scripts/lib/cli/pipeline.ts setup-git-auth
          git checkout -b "$BRANCH"
          git commit -m "chore: update screenshots via $SOURCE"
          npx tsx .github/scripts/lib/cli/pipeline.ts push "$BRANCH"

          gh pr create \
            --head "$BRANCH" \
            --base master \
            --title "chore: update screenshots (${{ steps.diff.outputs.changed_count }} files changed)" \
            --body "$(cat <<PREOF
          ## Auto-captured screenshots

          **Source:** $SOURCE
          Triggered by a merge to master that changed UI files.

          Review the screenshot diffs to verify UI changes look correct.
          PREOF
          )"
