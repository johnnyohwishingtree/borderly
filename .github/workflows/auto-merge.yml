name: Auto Merge

# Single gate that controls when PRs merge to master.
# Only merges when ALL conditions are met:
#   1. Tests workflow passed
#   2. E2E Smoke Tests passed (all 3 jobs)
#   3. PR has at least one approval
#   4. No unresolved review threads

on:
  # Re-evaluate when CI completes
  workflow_run:
    workflows: ["Tests", "E2E Smoke Tests"]
    types: [completed]

  # Re-evaluate when a review is submitted
  pull_request_review:
    types: [submitted]

  # Re-evaluate when new commits are pushed (review-fix resolves threads before pushing)
  pull_request:
    types: [synchronize]

  # Allow watcher or other workflows to request a merge evaluation
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to evaluate for merge'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ inputs.pr_number || github.event.workflow_run.head_branch || github.event.pull_request.head.ref || github.event.pull_request_review.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # Only evaluate for PRs targeting master
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Resolve PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          source .github/scripts/lib.sh
          export INPUT_PR_NUMBER="${{ inputs.pr_number }}"
          export WORKFLOW_RUN_HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
          export PR_NUMBER_FROM_EVENT="${{ github.event.pull_request.number || github.event.pull_request_review.pull_request.number }}"
          PR_NUM=$(get_pr_number "${{ github.event_name }}")
          if [ -z "$PR_NUM" ]; then
            echo "No open PR found — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=$PR_NUM" >> "$GITHUB_OUTPUT"

      - name: Evaluate merge readiness
        if: steps.pr.outputs.skip != 'true'
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          RESULT=$(bash .github/scripts/evaluate-merge-gate.sh "${{ steps.pr.outputs.number }}")
          ACTION=$(echo "$RESULT" | jq -r '.action')
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "$RESULT" | jq .

      - name: Execute merge action
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          PR_NUM="${{ steps.pr.outputs.number }}"
          ACTION="${{ steps.gate.outputs.action }}"

          if [ "$ACTION" = "merge" ]; then
            echo "All conditions met — merging PR #$PR_NUM"
            gh pr merge "$PR_NUM" --repo "$REPO" --squash \
              && echo "PR #$PR_NUM merged successfully" \
              || echo "Failed to merge PR #$PR_NUM (may already be merged)"

          elif [ "$ACTION" = "update_branch" ]; then
            echo "Branch is behind master — updating branch before merge"
            BRANCH_NAME=$(gh pr view "$PR_NUM" --repo "$REPO" --json headRefName -q '.headRefName' 2>/dev/null || echo "")
            gh api "repos/$REPO/merges" \
              -f base="$BRANCH_NAME" \
              -f head="master" \
              -f commit_message="Merge master into $BRANCH_NAME (auto-update before merge)" \
              2>/dev/null \
              && echo "Branch updated — CI will re-run and auto-merge will re-evaluate on completion" \
              || echo "Failed to update branch — may need manual intervention"

          elif [ "$ACTION" = "skip" ]; then
            echo "PR does not target master — skipping"

          else
            echo "Not ready to merge — waiting for all conditions"
          fi
