name: Auto Merge

# Single gate that controls when PRs merge to master.
# Only merges when ALL conditions are met:
#   1. Tests workflow passed
#   2. E2E Smoke Tests passed (all 3 jobs)
#   3. PR has at least one approval
#   4. No unresolved review threads
#   5. No active review-fix runs
#   6. No code review in progress (no "Code Review in Progress" comment)
#   7. Branch up to date with master

on:
  # Re-evaluate when CI completes
  workflow_run:
    workflows: ["Tests", "E2E Smoke Tests"]
    types: [completed]

  # Re-evaluate when a review is submitted
  pull_request_review:
    types: [submitted]

  # Re-evaluate when new commits are pushed (review-fix resolves threads before pushing)
  pull_request:
    types: [synchronize]

  # Re-evaluate all open PRs when master advances (PRs may now be behind)
  push:
    branches: [master]

  # Allow watcher or other workflows to request a merge evaluation
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to evaluate for merge'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event_name == 'push' && 'all-prs' || inputs.pr_number || github.event.workflow_run.head_branch || github.event.pull_request.head.ref || github.event.pull_request_review.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # Only evaluate for PRs targeting master
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pipeline TypeScript
        uses: ./.github/actions/setup-pipeline-ts

      - name: Resolve PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # On push to master, evaluate all open PRs (they may now be behind)
          if [ "${{ github.event_name }}" = "push" ]; then
            ALL_PRS=$(gh pr list --repo "$GITHUB_REPOSITORY" --base master --state open --json number -q '.[].number' | tr '\n' ',' | sed 's/,$//')
            if [ -z "$ALL_PRS" ]; then
              echo "No open PRs — skipping"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "number=$ALL_PRS" >> "$GITHUB_OUTPUT"
            echo "multi=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          export INPUT_PR_NUMBER="${{ inputs.pr_number }}"
          export WORKFLOW_RUN_HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
          export PR_NUMBER_FROM_EVENT="${{ github.event.pull_request.number || github.event.pull_request_review.pull_request.number }}"
          PR_NUM=$(npx tsx .github/scripts/lib/cli/pipeline.ts get-pr-number "${{ github.event_name }}")
          if [ -z "$PR_NUM" ]; then
            echo "No open PR found — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=$PR_NUM" >> "$GITHUB_OUTPUT"

      - name: Evaluate and execute merge action
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          evaluate_pr() {
            local PR_NUM="$1"
            echo "=== Evaluating PR #$PR_NUM ==="

            RESULT=$(npx tsx .github/scripts/lib/cli/evaluate-merge-gate.ts "$PR_NUM" 2>/dev/null || echo '{"action":"wait"}')
            ACTION=$(echo "$RESULT" | jq -r '.action')
            echo "$RESULT" | jq .

            if [ "$ACTION" = "merge" ]; then
              echo "All conditions met — merging PR #$PR_NUM"
              if gh pr merge "$PR_NUM" --repo "$REPO" --squash --admin; then
                echo "PR #$PR_NUM merged successfully"
                ISSUE_NUM=$(gh pr view "$PR_NUM" --repo "$REPO" --json body \
                  -q '.body' 2>/dev/null | grep -oE '(Closes|Fixes|Resolves)\s+#[0-9]+' | grep -oE '[0-9]+' | head -1 || true)
                if [ -n "$ISSUE_NUM" ]; then
                  export ACTIVITY_NAME="merge"
                  export ACTIVITY_LOCK_ID="merge-${GITHUB_RUN_ID}"
                  npx tsx .github/scripts/lib/cli/activity.ts success "$ISSUE_NUM" "merged" 2>/dev/null || true
                fi
              else
                echo "Failed to merge PR #$PR_NUM (may already be merged)"
              fi
            elif [ "$ACTION" = "update_branch" ]; then
              echo "Branch is behind master — updating and dispatching CI"
              npx tsx .github/scripts/lib/cli/pipeline.ts update-branch "$PR_NUM"
            elif [ "$ACTION" = "resolve_conflicts" ]; then
              echo "Branch has merge conflicts — dispatching resolve-conflicts.yml"
              npx tsx .github/scripts/lib/cli/pipeline.ts dispatch "resolve-conflicts.yml" \
                -f pr_number="$PR_NUM"
            elif [ "$ACTION" = "skip" ]; then
              echo "PR does not target master — skipping"
            else
              echo "Not ready to merge — waiting for all conditions"
            fi
          }

          # Handle single PR or multiple PRs (push to master evaluates all)
          if [ "${{ steps.pr.outputs.multi }}" = "true" ]; then
            IFS=',' read -ra PR_NUMS <<< "${{ steps.pr.outputs.number }}"
            for pr in "${PR_NUMS[@]}"; do
              evaluate_pr "$pr"
            done
          else
            evaluate_pr "${{ steps.pr.outputs.number }}"
          fi
