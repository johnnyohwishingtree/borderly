# deploy-pipeline.yml — Build, test, and deploy the Inngest pipeline server
#
# Triggers:
# - Push to master when pipeline/ files change
# - Manual dispatch
#
# Steps:
# 1. Typecheck + test the pipeline code
# 2. Build the Docker image
# 3. Push to container registry
# 4. Deploy to hosting platform
#
# Required secrets:
# - GH_PAT:              GitHub PAT for API calls from pipeline functions
# - INNGEST_SIGNING_KEY: Inngest signing key for request verification
# - INNGEST_EVENT_KEY:   Inngest event key for sending events
# - REGISTRY_URL:        Container registry URL (e.g., ghcr.io/owner/repo)
# - REGISTRY_USERNAME:   Registry auth username
# - REGISTRY_PASSWORD:   Registry auth password/token
#
# Required vars:
# - PIPELINE_DEPLOY_URL: URL where the pipeline server is deployed

name: Deploy Pipeline

on:
  push:
    branches: [master]
    paths:
      - 'pipeline/**'
      - '.github/workflows/deploy-pipeline.yml'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (use for hotfixes only)'
        type: boolean
        default: false

concurrency:
  group: deploy-pipeline
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ !inputs.skip_tests }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node

      - name: Install pipeline dependencies
        working-directory: pipeline
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: pipeline
        run: pnpm typecheck

      - name: Run tests
        working-directory: pipeline
        run: pnpm test

  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    env:
      REGISTRY: ${{ secrets.REGISTRY_URL || 'ghcr.io' }}
      IMAGE_NAME: ${{ github.repository }}/pipeline

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./pipeline
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build-and-push]
    if: needs.build-and-push.result == 'success'
    environment: production
    env:
      BASH_ENV: .github/scripts/lib.sh

    steps:
      - uses: actions/checkout@v4

      - name: Deploy notification
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "Pipeline server deployed successfully."
          echo "Image: ${{ needs.build-and-push.outputs.image_tag }}"
          echo ""
          echo "To complete deployment, configure your hosting platform with:"
          echo "  - GH_PAT secret"
          echo "  - GITHUB_REPOSITORY=${{ github.repository }}"
          echo "  - INNGEST_SIGNING_KEY secret"
          echo "  - INNGEST_EVENT_KEY secret"
          echo "  - PREFERRED_AGENT=claude"
          echo ""
          echo "Optional (parallel run / shadow mode):"
          echo "  - INNGEST_SHADOW_MODE=true  (observe-only, no write actions)"
          echo "  - PARITY_TRACKING_ISSUE=N   (GitHub issue for parity logging)"
          echo ""
          echo "Then register the Inngest endpoint URL in Inngest Cloud."

      - name: Verify health endpoint
        if: vars.PIPELINE_DEPLOY_URL
        run: |
          HEALTH_URL="${{ vars.PIPELINE_DEPLOY_URL }}/health"
          echo "Checking health at: $HEALTH_URL"

          for i in 1 2 3 4 5; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed (attempt $i)"
              curl -s "$HEALTH_URL" | jq .
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP_CODE — retrying in ${i}s..."
            sleep "$i"
          done

          echo "Health check failed after 5 attempts"
          exit 1
