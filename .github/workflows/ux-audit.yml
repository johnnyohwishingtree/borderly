name: UX Audit

# Daily UX flow audit — captures screenshots, analyzes state transitions,
# and creates epics with stories for any issues found.
#
# Runs at midnight PST (08:00 UTC) so fixes can be implemented overnight.

on:
  schedule:
    - cron: '0 8,20 * * *'  # twice daily: midnight + noon PST (08:00 + 20:00 UTC)
  workflow_dispatch:
    inputs:
      flow:
        description: 'Optional: specific flow to audit (e.g. "companion", "trip creation")'
        required: false
        type: string
      use_stitch:
        description: 'Generate Stitch UI mockups for each story'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: ux-audit
  cancel-in-progress: true

jobs:
  gate:
    if: vars.PIPELINE_ENABLED != 'false'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check if audit is needed
        id: check
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          # Skip if there's already an open UX audit epic
          OPEN_AUDITS=$(gh issue list --repo "$REPO" \
            --label "epic:ux-audit" --state open \
            --json number -q 'length' 2>/dev/null || echo "0")

          if [ "$OPEN_AUDITS" -gt 0 ]; then
            echo "Open UX audit epic exists — skipping"
            echo "should_run=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Skip if already at max open epics (shared limit with planner)
          MAX_OPEN_EPICS=3
          OPEN_EPICS=$(gh issue list --repo "$REPO" \
            --label "epic" --state open \
            --json number -q 'length' 2>/dev/null || echo "0")

          if [ "$OPEN_EPICS" -ge "$MAX_OPEN_EPICS" ]; then
            echo "Already $OPEN_EPICS open epics (max $MAX_OPEN_EPICS) — skipping"
            echo "should_run=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Skip if too many open stories (pipeline is backed up)
          OPEN_STORIES=$(gh issue list --repo "$REPO" \
            --label "story" --state open \
            --json number -q 'length' 2>/dev/null || echo "0")

          if [ "$OPEN_STORIES" -ge 15 ]; then
            echo "Too many open stories ($OPEN_STORIES) — skipping audit"
            echo "should_run=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "should_run=true" >> $GITHUB_OUTPUT

  capture:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node

      - name: Build webpack bundle
        run: npx webpack --config webpack.config.js --mode production

      - name: Capture screenshots
        run: |
          # Capture individual screen screenshots
          E2E_PROJECT=screenshot-capture npx playwright test captureScreenshots \
            --project=screenshot-capture --workers=1 || true

          # Capture flow sequences (before/after state transitions)
          E2E_PROJECT=screenshot-capture npx playwright test captureFlowSequences \
            --project=screenshot-capture --workers=1 || true

      - name: Update flow graph
        run: npx tsx e2e/scripts/generate-flow-graph.ts

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ux-audit-screenshots
          path: e2e/screenshots/
          retention-days: 7

  audit:
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node

      - name: Setup pipeline TypeScript
        uses: ./.github/actions/setup-pipeline-ts

      - name: Download screenshots
        uses: actions/download-artifact@v4
        with:
          name: ux-audit-screenshots
          path: e2e/screenshots/

      - name: Run Claude flow audit
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GH_PAT }}
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Bash(gh issue create:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh label create:*),Bash(cat:*),Bash(npx tsx:*),mcp__stitch__create_project,mcp__stitch__generate_screen_from_text,mcp__stitch__get_screen,mcp__stitch__list_projects"
          prompt: |
            You are a UX quality engineer for Borderly, a universal travel
            declaration app. Your job is to find UI/UX flow bugs and create
            GitHub issues to fix them.

            ## Context

            Read CLAUDE.md for full project context.
            Read `.claude/skills/flow-audit/SKILL.md` for the full audit methodology.

            ## Specific Flow (if requested)

            ${{ github.event.inputs.flow || 'No specific flow — audit all critical flows.' }}

            ## Stitch Mockups

            ${{ github.event.inputs.use_stitch == 'true' && 'ENABLED: For each story, generate a Stitch mockup showing the FIXED UI state. Use mcp__stitch__create_project to create a project (or reuse existing "Borderly UX Audit" project), then mcp__stitch__generate_screen_from_text for each screen mockup. Include the screenshot URL from the Stitch response in the story body under a "## Mockup" section.' || 'DISABLED: Do not generate Stitch mockups. Describe the expected UI in text.' }}

            ## Step 1: Load Data

            1. Read `e2e/screenshots/manifest.json` for screen metadata
            2. Read `e2e/screenshots/flow-graph.json` for navigation structure
            3. Read flow sequence screenshots from `e2e/screenshots/flows/` (if they exist)
            4. Read individual screenshots from `e2e/screenshots/`

            ## Step 2: Analyze Flows

            For each critical user flow, trace the data path:

            1. **Read the screen source code** — what state does it display?
            2. **Read the hook** — does it read and write state correctly?
            3. **Read the store** — does the write method actually persist data?
            4. **Check the return path** — when the user navigates back, does the
               screen re-read the updated state?

            Critical flows to check:
            - Onboarding → add companion → return to companion list
            - Create trip → trip appears in list
            - Fill leg form → form status updates on trip detail
            - Edit profile → changes visible on profile screen
            - Delete family member → removed from list
            - Switch profiles → correct data shown everywhere

            ## Step 3: Visual Analysis

            Read the screenshot PNG files and check:
            - Does the UI match the underlying state?
            - Are action results visible (toasts, list updates, badge changes)?
            - Are button labels contextually correct?
            - Is there visual feedback for every user action?

            ## Step 4: Create Epic (if issues found)

            If you find issues, create a GitHub epic with stories.

            Create the label first:
            ```bash
            gh label create "epic:ux-audit" --color "D93F0B" --description "Epic: UX Flow Audit findings" 2>/dev/null || true
            ```

            **Step 4a: Create the epic first (placeholder body):**
            ```bash
            gh issue create \
              --title "Epic: UX Flow Audit $(date +%Y-%m-%d) — N issues found" \
              --label "epic" \
              --label "epic:ux-audit" \
              --body "## Goal
            UX flow audit findings. Stories will be listed below once created.

            ## Stories
            (creating...)

            ## Success Criteria
            - All state transition bugs fixed with unit tests
            - pnpm typecheck && pnpm test && pnpm e2e all pass"
            ```

            **Step 4b: Create each story.** CRITICAL — labels must include ALL THREE:
            - `story` — identifies it for the orchestrator
            - `pending` — marks it as ready for the pipeline
            - `epic:ux-audit` — links it to this epic

            ```bash
            gh issue create \
              --title "Story: <specific task>" \
              --label "story" \
              --label "pending" \
              --label "epic:ux-audit" \
              --body "$(cat <<'EOF'
            **Parent Epic:** #<epic_number>
            **Skill:** /plan-feature

            ## Description
            <what needs to be fixed>

            ## Current Behavior
            <what happens now, with screenshot reference if available>

            ## Expected Behavior
            <what should happen after the fix>

            ## Root Cause
            <which file/function is broken and why>

            ## Files to Modify
            - <file paths with specific guidance>

            ## Acceptance Criteria
            - [ ] Implementation complete
            - [ ] Unit test verifying the fix
            - [ ] Tests pass (pnpm typecheck && pnpm test && pnpm e2e)
            EOF
            )"
            ```

            **Step 4c: Update the epic body** with actual story issue numbers.
            You MUST use `gh issue edit <epic_number>` to replace the body with
            the real checklist. Use this exact format:

            ```bash
            gh issue edit <epic_number> --body "$(cat <<'EOF'
            ## Goal
            UX flow audit findings — N issues across [areas].

            ## Stories
            - [ ] #<story1_number> Story: <title>
            - [ ] #<story2_number> Story: <title>
            ...

            ## Success Criteria
            - All state transition bugs fixed with unit tests
            - pnpm typecheck && pnpm test && pnpm e2e all pass
            EOF
            )"
            ```

            ## Step 5: Report

            If no issues found, output: "UX Flow Audit: All critical flows pass."
            If issues found, output the epic number and story count.

            ## Rules

            - Do NOT fix code — only create issues
            - Be specific — "button says wrong text" not "UI is confusing"
            - Include file paths and line numbers
            - Each story must be completable in a single Claude session
            - Maximum 6 stories per epic (batch if more issues exist)
            - Check existing open issues to avoid duplicates
        env:
          STITCH_API_KEY: ${{ secrets.STITCH_API_KEY }}

      - name: Trigger first story
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          # Find the newest open UX audit epic
          EPIC=$(gh issue list --repo "$REPO" --label "epic:ux-audit" --state open \
            --json number -q '[.[] | .number] | sort | last')

          if [ -z "$EPIC" ] || [ "$EPIC" = "null" ]; then
            echo "No open UX audit epic found — audit found no issues"
            exit 0
          fi

          # Find first pending story for this epic
          FIRST_STORY=$(gh issue list --repo "$REPO" \
            --label "story" --label "pending" --label "epic:ux-audit" \
            --state open --json number \
            -q '[.[] | .number] | sort | .[0]')

          if [ -z "$FIRST_STORY" ] || [ "$FIRST_STORY" = "null" ]; then
            echo "No pending stories found for epic #$EPIC"
            exit 0
          fi

          # Check if another story is already in progress
          ANY_IN_PROGRESS=$(gh issue list --repo "$REPO" \
            --label "story" --label "in-progress" \
            --state open --json number -q 'length')

          if [ "$ANY_IN_PROGRESS" -gt 0 ]; then
            echo "Another story is already in-progress — pipeline will pick up audit stories next"
            exit 0
          fi

          echo "Triggering first audit story: #$FIRST_STORY"
          gh issue edit "$FIRST_STORY" --repo "$REPO" \
            --remove-label "pending" --add-label "in-progress" || true
          npx tsx .github/scripts/lib/cli/pipeline.ts trigger-story-agent "$FIRST_STORY" "claude"
