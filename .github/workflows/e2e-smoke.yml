name: E2E Smoke Tests

on:
  push:
    branches: [master]
    paths-ignore:
      - '.github/scripts/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.claude/**'
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [master]
    paths-ignore:
      - '.github/scripts/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.claude/**'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  # Shared webpack build — cached and reused by all test jobs
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node
        with:
          cache: 'true'
      - name: Build webpack bundle
        run: npx webpack --config webpack.config.js
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: e2e-bundle
          path: e2e/dist/
          retention-days: 1

  # Core chromium tests (24 tests) + QR workflow (7 tests)
  test-chromium:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node
        with:
          cache: 'true'
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: e2e-bundle
          path: e2e/dist/
      - name: Run chromium + QR tests
        run: npx playwright test --reporter=line
        env:
          CI: true
          E2E_PROJECT: chromium,qr-workflow,account-setup,portal-submission,family,country-submissions

  # Performance tests (9 tests) — run in parallel with chromium
  test-performance:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node
        with:
          cache: 'true'
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: e2e-bundle
          path: e2e/dist/
      - name: Run performance tests
        run: npx playwright test --reporter=line
        env:
          CI: true
          E2E_PROJECT: performance

  # Cross-browser smoke (firefox + mobile) — run in parallel
  test-cross-browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node
        with:
          cache: 'true'
      - name: Install Playwright browsers
        run: npx playwright install chromium firefox
      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: e2e-bundle
          path: e2e/dist/
      - name: Run cross-browser smoke tests
        run: npx playwright test --reporter=line
        env:
          CI: true
          E2E_PROJECT: firefox-smoke,mobile-smoke

  # Auto-fix on failure (runs after all test jobs)
  notify:
    needs: [test-chromium, test-performance, test-cross-browser]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Setup pipeline TypeScript
        uses: ./.github/actions/setup-pipeline-ts

      - name: Dispatch verify-and-fix on PR failure
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          npx tsx .github/scripts/lib/cli/pipeline.ts ci-dispatch-pr \
            "${{ github.event.pull_request.number }}" \
            "${{ github.head_ref }}" \
            "${{ github.run_id }}" \
            "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "e2e" \
            "Common E2E issues: native modules need web mocks in e2e/mocks/ + aliases in webpack.config.js."

      - name: Dispatch verify-and-fix on master push failure
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          npx tsx .github/scripts/lib/cli/pipeline.ts ci-dispatch-master \
            "${{ github.run_id }}" \
            "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "e2e" \
            "fix/master-e2e" \
            "Common E2E issues: native modules need web mocks in e2e/mocks/ + aliases in webpack.config.js."
