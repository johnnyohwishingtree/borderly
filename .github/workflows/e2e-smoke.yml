name: E2E Smoke Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  # Check if app code changed — skip E2E for pipeline-only PRs
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      skip_e2e: ${{ steps.check.outputs.skip_e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check if only pipeline files changed
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip_e2e=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            echo "skip_e2e=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          CHANGED=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null || echo "")

          if [ -z "$CHANGED" ]; then
            echo "skip_e2e=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if ALL changed files are pipeline/docs only
          SKIP_E2E=true
          while IFS= read -r file; do
            case "$file" in
              .github/*|.claude/*|docs/*|*.md|e2e/screenshots/*|maestro/*) ;;
              *) SKIP_E2E=false; break ;;
            esac
          done <<< "$CHANGED"

          echo "skip_e2e=$SKIP_E2E" >> $GITHUB_OUTPUT
          if [ "$SKIP_E2E" = "true" ]; then
            echo "Only pipeline/docs files changed — skipping E2E"
          fi

  # Shared webpack build — cached and reused by all test jobs
  build:
    needs: check-changes
    if: needs.check-changes.outputs.skip_e2e != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node
        with:
          cache: 'true'
      - name: Build webpack bundle
        run: npx webpack --config webpack.config.js
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: e2e-bundle
          path: e2e/dist/
          retention-days: 1

  # Chromium E2E tests — split into 3 parallel shards via matrix
  test-chromium-shard:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core
            projects: chromium,qr-workflow
          - shard: submissions
            projects: portal-submission,country-submissions
          - shard: workflows
            projects: account-setup,family
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node
        with:
          cache: 'true'
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: e2e-bundle
          path: e2e/dist/
      - name: Run E2E tests (${{ matrix.shard }})
        run: npx playwright test --reporter=line
        env:
          CI: true
          E2E_PROJECT: ${{ matrix.projects }}

  # Rollup gate — satisfies the "test-chromium" required status check
  test-chromium:
    needs: test-chromium-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check shard results
        run: |
          RESULT="${{ needs.test-chromium-shard.result }}"
          if [ "$RESULT" = "success" ] || [ "$RESULT" = "skipped" ]; then
            echo "Chromium shards: $RESULT"
          else
            echo "One or more chromium shards failed: $RESULT"
            exit 1
          fi

  # Performance tests (9 tests) — run in parallel with chromium
  test-performance:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node
        with:
          cache: 'true'
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: e2e-bundle
          path: e2e/dist/
      - name: Run performance tests
        run: npx playwright test --reporter=line
        env:
          CI: true
          E2E_PROJECT: performance

  # Cross-browser smoke (firefox + mobile) — run in parallel
  test-cross-browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node
        with:
          cache: 'true'
      - name: Install Playwright browsers
        run: npx playwright install chromium firefox
      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: e2e-bundle
          path: e2e/dist/
      - name: Run cross-browser smoke tests
        run: npx playwright test --reporter=line
        env:
          CI: true
          E2E_PROJECT: firefox-smoke,mobile-smoke

  # Auto-fix on failure (runs after all test jobs)
  notify:
    needs: [test-chromium, test-performance, test-cross-browser]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Setup pipeline TypeScript
        uses: ./.github/actions/setup-pipeline-ts

      - name: Dispatch verify-and-fix on PR failure
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          npx tsx .github/scripts/lib/cli/pipeline.ts ci-dispatch-pr \
            "${{ github.event.pull_request.number }}" \
            "${{ github.head_ref }}" \
            "${{ github.run_id }}" \
            "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "e2e" \
            "Common E2E issues: native modules need web mocks in e2e/mocks/ + aliases in webpack.config.js."

      - name: Dispatch verify-and-fix on master push failure
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          npx tsx .github/scripts/lib/cli/pipeline.ts ci-dispatch-master \
            "${{ github.run_id }}" \
            "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "e2e" \
            "fix/master-e2e" \
            "Common E2E issues: native modules need web mocks in e2e/mocks/ + aliases in webpack.config.js."
