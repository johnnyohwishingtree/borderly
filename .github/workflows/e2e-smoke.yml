name: E2E Smoke Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  # Shared webpack build — cached and reused by all test jobs
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node
        with:
          cache: 'true'
      - name: Build webpack bundle
        run: npx webpack --config webpack.config.js
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: e2e-bundle
          path: e2e/dist/
          retention-days: 1

  # Core chromium tests (24 tests) + QR workflow (7 tests)
  test-chromium:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node
        with:
          cache: 'true'
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: e2e-bundle
          path: e2e/dist/
      - name: Run chromium + QR tests
        run: npx playwright test --reporter=line
        env:
          CI: true
          E2E_PROJECT: chromium,qr-workflow,account-setup,portal-submission,family,country-submissions

  # Performance tests (9 tests) — run in parallel with chromium
  test-performance:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node
        with:
          cache: 'true'
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: e2e-bundle
          path: e2e/dist/
      - name: Run performance tests
        run: npx playwright test --reporter=line
        env:
          CI: true
          E2E_PROJECT: performance

  # Cross-browser smoke (firefox + mobile) — run in parallel
  test-cross-browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node
        with:
          cache: 'true'
      - name: Install Playwright browsers
        run: npx playwright install chromium firefox
      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: e2e-bundle
          path: e2e/dist/
      - name: Run cross-browser smoke tests
        run: npx playwright test --reporter=line
        env:
          CI: true
          E2E_PROJECT: firefox-smoke,mobile-smoke

  # Notify Claude on failure (runs after all test jobs)
  notify:
    needs: [test-chromium, test-performance, test-cross-browser]
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      BASH_ENV: .github/scripts/lib.sh
    steps:
      - uses: actions/checkout@v4
      - name: Send verify-and-fix event to Inngest on failure
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          INNGEST_EVENT_KEY: ${{ secrets.INNGEST_EVENT_KEY }}
          INNGEST_API_URL: ${{ vars.INNGEST_API_URL || 'https://inn.gs/e' }}
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          BRANCH="${{ github.head_ref }}"

          if [[ "$BRANCH" != claude/* ]]; then
            echo "Not a claude/ branch — skipping"
            exit 0
          fi

          if [ -z "$INNGEST_EVENT_KEY" ]; then
            echo "::warning::INNGEST_EVENT_KEY not set — skipping Inngest event"
            exit 0
          fi

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          FAILED_JOBS=$(gh run view ${{ github.run_id }} --json jobs \
            -q '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")' 2>/dev/null || echo "unknown")

          comment_on_issue "$PR_NUM" "E2E smoke tests failed (${FAILED_JOBS}). Sending to Inngest verify-and-fix. [View run]($RUN_URL)"

          PAYLOAD=$(jq -n \
            --arg name "pipeline/verify.requested" \
            --arg branch "$BRANCH" \
            --arg workBranch "" \
            --argjson issueNumber "$PR_NUM" \
            --arg checks "e2e" \
            --argjson fixEnabled true \
            --argjson maxAttempts 3 \
            --argjson attempt 1 \
            --arg mergeInto "" \
            --argjson createPr false \
            --arg fixContext "E2E smoke tests failed on PR #${PR_NUM}. Failed jobs: ${FAILED_JOBS}. Run: ${RUN_URL}. Common E2E issues: native modules need web mocks in e2e/mocks/ + aliases in webpack.config.js." \
            --arg repo "${{ github.repository }}" \
            '{name: $name, data: {branch: $branch, workBranch: $workBranch, issueNumber: $issueNumber, checks: $checks, fixEnabled: $fixEnabled, maxAttempts: $maxAttempts, attempt: $attempt, mergeInto: $mergeInto, createPr: $createPr, fixContext: $fixContext, repo: $repo}}')

          HTTP_CODE=$(curl -s -o /tmp/inngest_response.txt -w "%{http_code}" \
            -X POST "${INNGEST_API_URL}/${INNGEST_EVENT_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Sent pipeline/verify.requested to Inngest (HTTP $HTTP_CODE)"
          else
            echo "::warning::Inngest event send failed with HTTP $HTTP_CODE"
            cat /tmp/inngest_response.txt
          fi
