name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASH_ENV: .github/scripts/lib.sh

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node

      - name: Type check
        run: pnpm typecheck

      - name: Metro bundle check (iOS)
        run: |
          npx react-native bundle \
            --platform ios \
            --dev false \
            --entry-file index.js \
            --bundle-output /tmp/ios-bundle.js \
            --assets-dest /tmp/ios-assets 2>&1 | tee /tmp/bundle_output.txt
          exit ${PIPESTATUS[0]}

      - name: Metro bundle check (Android)
        run: |
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output /tmp/android-bundle.js \
            --assets-dest /tmp/android-assets 2>&1 | tee /tmp/android_bundle_output.txt
          exit ${PIPESTATUS[0]}

      - name: Run tests
        id: tests
        run: |
          pnpm test --ci --forceExit 2>&1 | tee /tmp/test_output.txt
          exit ${PIPESTATUS[0]}

      - name: Send verify-and-fix event to Inngest on failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          INNGEST_EVENT_KEY: ${{ secrets.INNGEST_EVENT_KEY }}
          INNGEST_API_URL: ${{ vars.INNGEST_API_URL || 'https://inn.gs/e' }}
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          BRANCH="${{ github.head_ref }}"

          # Only auto-fix on claude/ branches (don't spam human PRs)
          if [[ "$BRANCH" != claude/* ]]; then
            echo "Not a claude/ branch — skipping"
            exit 0
          fi

          if [ -z "$INNGEST_EVENT_KEY" ]; then
            echo "::warning::INNGEST_EVENT_KEY not set — skipping Inngest event"
            exit 0
          fi

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          FAILED_STEPS=$(gh run view ${{ github.run_id }} --json jobs \
            -q '[.jobs[].steps[] | select(.conclusion == "failure") | .name] | join(", ")' 2>/dev/null || echo "unknown")

          comment_on_issue "$PR_NUM" "CI checks failed (${FAILED_STEPS}). Sending to Inngest verify-and-fix. [View run]($RUN_URL)"

          PAYLOAD=$(jq -n \
            --arg name "pipeline/verify.requested" \
            --arg branch "$BRANCH" \
            --arg workBranch "" \
            --argjson issueNumber "$PR_NUM" \
            --arg checks "ci" \
            --argjson fixEnabled true \
            --argjson maxAttempts 3 \
            --argjson attempt 1 \
            --arg mergeInto "" \
            --argjson createPr false \
            --arg fixContext "CI failed on PR #${PR_NUM}. Failed steps: ${FAILED_STEPS}. Run: ${RUN_URL}" \
            --arg repo "${{ github.repository }}" \
            '{name: $name, data: {branch: $branch, workBranch: $workBranch, issueNumber: $issueNumber, checks: $checks, fixEnabled: $fixEnabled, maxAttempts: $maxAttempts, attempt: $attempt, mergeInto: $mergeInto, createPr: $createPr, fixContext: $fixContext, repo: $repo}}')

          HTTP_CODE=$(curl -s -o /tmp/inngest_response.txt -w "%{http_code}" \
            -X POST "${INNGEST_API_URL}/${INNGEST_EVENT_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Sent pipeline/verify.requested to Inngest (HTTP $HTTP_CODE)"
          else
            echo "::warning::Inngest event send failed with HTTP $HTTP_CODE"
            cat /tmp/inngest_response.txt
          fi

  pipeline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node

      - name: Install pipeline dependencies
        working-directory: pipeline
        run: pnpm install --frozen-lockfile

      - name: Pipeline type check
        working-directory: pipeline
        run: pnpm typecheck

      - name: Pipeline tests (unit + integration)
        working-directory: pipeline
        run: pnpm test
