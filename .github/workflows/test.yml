name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pipeline TypeScript
        uses: ./.github/actions/setup-pipeline-ts

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node

      - name: Type check
        run: pnpm typecheck

      - name: Metro bundle check (iOS)
        run: |
          npx react-native bundle \
            --platform ios \
            --dev false \
            --entry-file index.js \
            --bundle-output /tmp/ios-bundle.js \
            --assets-dest /tmp/ios-assets 2>&1 | tee /tmp/bundle_output.txt
          exit ${PIPESTATUS[0]}

      - name: Metro bundle check (Android)
        run: |
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output /tmp/android-bundle.js \
            --assets-dest /tmp/android-assets 2>&1 | tee /tmp/android_bundle_output.txt
          exit ${PIPESTATUS[0]}

      - name: Run tests
        id: tests
        run: |
          pnpm test --ci --forceExit 2>&1 | tee /tmp/test_output.txt
          exit ${PIPESTATUS[0]}

      - name: Dispatch verify-and-fix on PR failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          npx tsx .github/scripts/lib/cli/pipeline.ts ci-dispatch-pr \
            "${{ github.event.pull_request.number }}" \
            "${{ github.head_ref }}" \
            "${{ github.run_id }}" \
            "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "ci"

      - name: Dispatch verify-and-fix on master push failure
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          npx tsx .github/scripts/lib/cli/pipeline.ts ci-dispatch-master \
            "${{ github.run_id }}" \
            "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "ci" \
            "fix/master-ci"
