name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Check if app code changed — skip tests for pipeline/docs/screenshot-only PRs
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      skip_tests: ${{ steps.check.outputs.skip_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect app-relevant changes
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip_tests=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            echo "skip_tests=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null || echo "")

          if [ -z "$CHANGED" ]; then
            echo "skip_tests=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if ALL changed files are non-app (pipeline/docs/screenshots)
          SKIP_TESTS=true
          while IFS= read -r file; do
            case "$file" in
              .github/*|.claude/*|docs/*|*.md|e2e/screenshots/*|maestro/*) ;;
              *) SKIP_TESTS=false; break ;;
            esac
          done <<< "$CHANGED"

          echo "skip_tests=$SKIP_TESTS" >> $GITHUB_OUTPUT
          if [ "$SKIP_TESTS" = "true" ]; then
            echo "Only pipeline/docs/screenshot files changed — skipping app tests"
          fi

  typecheck:
    needs: check-changes
    if: needs.check-changes.outputs.skip_tests != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - name: Type check
        run: pnpm typecheck

  bundle-ios:
    needs: check-changes
    if: needs.check-changes.outputs.skip_tests != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - name: Metro bundle check (iOS)
        run: |
          npx react-native bundle \
            --platform ios \
            --dev false \
            --entry-file index.js \
            --bundle-output /tmp/ios-bundle.js \
            --assets-dest /tmp/ios-assets 2>&1 | tee /tmp/bundle_output.txt
          exit ${PIPESTATUS[0]}

  bundle-android:
    needs: check-changes
    if: needs.check-changes.outputs.skip_tests != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - name: Metro bundle check (Android)
        run: |
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output /tmp/android-bundle.js \
            --assets-dest /tmp/android-assets 2>&1 | tee /tmp/android_bundle_output.txt
          exit ${PIPESTATUS[0]}

  test:
    needs: check-changes
    if: needs.check-changes.outputs.skip_tests != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - name: Run tests
        id: tests
        run: |
          pnpm test --ci --forceExit 2>&1 | tee /tmp/test_output.txt
          exit ${PIPESTATUS[0]}

