name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASH_ENV: .github/scripts/lib.sh

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node

      - name: Type check
        run: pnpm typecheck

      - name: Metro bundle check (iOS)
        run: |
          npx react-native bundle \
            --platform ios \
            --dev false \
            --entry-file index.js \
            --bundle-output /tmp/ios-bundle.js \
            --assets-dest /tmp/ios-assets 2>&1 | tee /tmp/bundle_output.txt
          exit ${PIPESTATUS[0]}

      - name: Metro bundle check (Android)
        run: |
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output /tmp/android-bundle.js \
            --assets-dest /tmp/android-assets 2>&1 | tee /tmp/android_bundle_output.txt
          exit ${PIPESTATUS[0]}

      - name: Run tests
        id: tests
        run: |
          pnpm test --ci --forceExit 2>&1 | tee /tmp/test_output.txt
          exit ${PIPESTATUS[0]}

      - name: Dispatch verify-and-fix on failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          BRANCH="${{ github.head_ref }}"

          # Only auto-fix on claude/ branches (don't spam human PRs)
          if [[ "$BRANCH" != claude/* ]]; then
            echo "Not a claude/ branch — skipping"
            exit 0
          fi

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          FAILED_STEPS=$(gh run view ${{ github.run_id }} --json jobs \
            -q '[.jobs[].steps[] | select(.conclusion == "failure") | .name] | join(", ")' 2>/dev/null || echo "unknown")

          comment_on_issue "$PR_NUM" "CI checks failed (${FAILED_STEPS}). Dispatching verify-and-fix with auto-retry. [View run]($RUN_URL)"

          dispatch_workflow "verify-and-fix.yml" \
            -f branch="$BRANCH" \
            -f issue_number="$PR_NUM" \
            -f checks="ci" \
            -f fix_enabled="true" \
            -f max_attempts="3" \
            -f fix_context="CI failed on PR #${PR_NUM}. Failed steps: ${FAILED_STEPS}. Run: ${RUN_URL}"

  pipeline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node

      - name: Install pipeline dependencies
        working-directory: pipeline
        run: pnpm install --frozen-lockfile

      - name: Pipeline type check
        working-directory: pipeline
        run: pnpm typecheck

      - name: Pipeline tests (unit + integration)
        working-directory: pipeline
        run: pnpm test
