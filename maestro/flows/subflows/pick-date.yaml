# Shared subflow: Pick a date using the DatePickerField modal
#
# The DatePickerField opens a Modal with Month/Day/Year column pickers
# and a "Done" button. Maestro CAN see the modal header elements
# (Clear, title, Done) even though column picker content may be harder
# to interact with.
#
# This subflow taps "Done" to confirm the default date (today or the
# field's current value).
#
# Usage from any flow:
#   # First tap the date field to open the picker
#   - tapOn:
#       id: "leg-0-arrival-date"
#   # Then run this subflow to confirm the default date
#   - runFlow: pick-date.yaml
appId: com.borderly.app
---

# Wait for modal to slide up
- extendedWaitUntil:
    visible: "Done"
    timeout: 3000

# Tap "Done" to confirm the default date
- tapOn: "Done"
