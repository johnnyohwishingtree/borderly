# Shared subflow: Create a Malaysia trip with full leg details
#
# Usage from any flow:
#   - runFlow: subflows/create-malaysia-trip.yaml
#
# Precondition: On "Your Trips" screen (no existing trips)
# Postcondition: Trip created, back on "Your Trips" with trip card visible
appId: com.borderly.app
---

- tapOn:
    id: "create-first-trip-button"

- extendedWaitUntil:
    visible: "Create New Trip"
    timeout: 10000
- extendedWaitUntil:
    visible: "No destinations added yet"
    timeout: 5000

# Add Malaysia destination
- tapOn:
    id: "add-destination-button"
- scrollUntilVisible:
    element:
      id: "country-MYS"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "country-MYS"

# Trip name
- scrollUntilVisible:
    element: "Trip Name"
    direction: UP
    timeout: 5000
- tapOn:
    id: "trip-name-input"
- inputText: "Malaysia Trip"
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

# Malaysia leg details
- scrollUntilVisible:
    element:
      id: "leg-0-arrival-date"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "leg-0-arrival-date"
- runFlow: subflows/pick-date.yaml
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

- scrollUntilVisible:
    element:
      id: "leg-0-departure-date"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "leg-0-departure-date"
- runFlow: subflows/pick-date.yaml
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

- scrollUntilVisible:
    element:
      id: "leg-0-flight-number"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "leg-0-flight-number"
- inputText: "MH88"
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

- scrollUntilVisible:
    element:
      id: "leg-0-airline-code"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "leg-0-airline-code"
- inputText: "MH"
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

- scrollUntilVisible:
    element:
      id: "leg-0-arrival-airport"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "leg-0-arrival-airport"
- inputText: "KUL"
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

- scrollUntilVisible:
    element:
      id: "leg-0-accommodation-name"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "leg-0-accommodation-name"
- inputText: "Mandarin Oriental KL"
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

- scrollUntilVisible:
    element:
      id: "leg-0-accommodation-address"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "leg-0-accommodation-address"
- inputText: "Kuala Lumpur City Centre"
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

- scrollUntilVisible:
    element:
      id: "leg-0-accommodation-city"
    direction: DOWN
    timeout: 5000
- swipe:
    start: "50%,50%"
    end: "50%,30%"
    duration: 300
- tapOn:
    id: "leg-0-accommodation-city"
- inputText: "Kuala Lumpur"

- tapOn:
    id: "leg-0-accommodation-postal-code"
- inputText: "50088"
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

# Scroll to bottom and create trip
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200
- scrollUntilVisible:
    element: "Hotel phone number"
    direction: DOWN
    timeout: 5000
- swipe:
    direction: UP
    duration: 500
- swipe:
    direction: UP
    duration: 500
- tapOn:
    id: "create-trip-button"

# Handle result
- runFlow:
    when:
      visible: "Validation Error"
    commands:
      - takeScreenshot: validation_error
      - tapOn: "OK"
- extendedWaitUntil:
    visible: "Success"
    timeout: 15000
- tapOn: "OK"

# Verify trip list
- extendedWaitUntil:
    visible: "Your Trips"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "trip-card-Malaysia Trip"
    timeout: 10000
