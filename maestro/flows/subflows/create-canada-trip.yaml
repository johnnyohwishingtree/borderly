# Shared subflow: Create a Canada trip with full leg details
#
# Usage from any flow:
#   - runFlow: subflows/create-canada-trip.yaml
#
# Precondition: On "Your Trips" screen (no existing trips)
# Postcondition: Trip created, back on "Your Trips" with trip card visible
appId: com.borderly.app
---

- tapOn:
    id: "create-first-trip-button"

- extendedWaitUntil:
    visible: "Create New Trip"
    timeout: 10000
- extendedWaitUntil:
    visible: "No destinations added yet"
    timeout: 5000

# Add Canada destination
- tapOn:
    id: "add-destination-button"
- scrollUntilVisible:
    element:
      id: "country-CAN"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "country-CAN"

# Trip name
- scrollUntilVisible:
    element: "Trip Name"
    direction: UP
    timeout: 5000
- tapOn:
    id: "trip-name-input"
- inputText: "Canada Trip"
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

# Canada leg details
- scrollUntilVisible:
    element:
      id: "leg-0-arrival-date"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "leg-0-arrival-date"
- runFlow: subflows/pick-date.yaml
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

- scrollUntilVisible:
    element:
      id: "leg-0-departure-date"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "leg-0-departure-date"
- runFlow: subflows/pick-date.yaml
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

- scrollUntilVisible:
    element:
      id: "leg-0-flight-number"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "leg-0-flight-number"
- inputText: "AC34"
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

- scrollUntilVisible:
    element:
      id: "leg-0-airline-code"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "leg-0-airline-code"
- inputText: "AC"
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

- scrollUntilVisible:
    element:
      id: "leg-0-arrival-airport"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "leg-0-arrival-airport"
- inputText: "YVR"
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

- scrollUntilVisible:
    element:
      id: "leg-0-accommodation-name"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "leg-0-accommodation-name"
- inputText: "Fairmont Pacific Rim"
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

- scrollUntilVisible:
    element:
      id: "leg-0-accommodation-address"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "leg-0-accommodation-address"
- inputText: "1038 Canada Place"
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

- scrollUntilVisible:
    element:
      id: "leg-0-accommodation-city"
    direction: DOWN
    timeout: 5000
- swipe:
    start: "50%,50%"
    end: "50%,30%"
    duration: 300
- tapOn:
    id: "leg-0-accommodation-city"
- inputText: "Vancouver"

- tapOn:
    id: "leg-0-accommodation-postal-code"
- inputText: "V6C 0B9"
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

# Scroll to bottom and create trip
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200
- scrollUntilVisible:
    element: "Hotel phone number"
    direction: DOWN
    timeout: 5000
- swipe:
    direction: UP
    duration: 500
- swipe:
    direction: UP
    duration: 500
- tapOn:
    id: "create-trip-button"

# Handle result
- runFlow:
    when:
      visible: "Validation Error"
    commands:
      - takeScreenshot: validation_error
      - tapOn: "OK"
- extendedWaitUntil:
    visible: "Success"
    timeout: 15000
- tapOn: "OK"

# Verify trip list
- extendedWaitUntil:
    visible: "Your Trips"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "trip-card-Canada Trip"
    timeout: 10000
