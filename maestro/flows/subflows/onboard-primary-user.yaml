# Shared subflow: Onboard primary user from app launch to main screen
#
# Usage from any flow:
#   - runFlow: subflows/onboard-primary-user.yaml
#
# Precondition: App launched with clearState: true
# Postcondition: On "Your Trips" main screen, onboarding complete
appId: com.borderly.app
---

# === WELCOME SCREEN ===
- extendedWaitUntil:
    visible: "Borderly"
    timeout: 15000
- assertVisible: "Welcome to"
- scrollUntilVisible:
    element:
      id: "take-tutorial-button"
    direction: DOWN
- tapOn:
    id: "take-tutorial-button"

# === TUTORIAL SCREEN ===
- extendedWaitUntil:
    visible: "Step 1 of 3"
    timeout: 10000
- tapOn:
    id: "tutorial-skip-button"

# === PASSPORT SCAN SCREEN ===
- extendedWaitUntil:
    visible: "Passport Information"
    timeout: 15000

# Dismiss performance optimization hint if present
- runFlow:
    when:
      visible: "Performance Optimization Enabled"
    commands:
      - tapOn: "Dismiss"

# Choose manual entry
- scrollUntilVisible:
    element:
      id: "enter-manually-button"
    direction: DOWN
- tapOn:
    id: "enter-manually-button"

# === MANUAL PASSPORT FORM ===
- extendedWaitUntil:
    visible:
      id: "passport-number-input"
    timeout: 10000

# Swipe content down to reveal passport number at top
- swipe:
    start: "50%,30%"
    end: "50%,60%"
    duration: 300

# Passport Number
- tapOn:
    id: "passport-number-input"
- inputText: "L12345678"
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

# Surname
- scrollUntilVisible:
    element:
      id: "surname-input"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "surname-input"
- inputText: "SMITH"
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

# Given Names
- scrollUntilVisible:
    element:
      id: "given-names-input"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "given-names-input"
- inputText: "JOHN MICHAEL"
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

# Nationality (searchable dropdown)
- scrollUntilVisible:
    element:
      id: "nationality-input"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "nationality-input-trigger"
# Dropdown opens — type in search field to filter
- extendedWaitUntil:
    visible:
      id: "nationality-input-search"
    timeout: 5000
- tapOn:
    id: "nationality-input-search"
- eraseText: 20
- inputText: "United States"
- pressKey: Enter
- swipe:
    start: "50%,70%"
    end: "50%,50%"
    duration: 200
- tapOn:
    id: "nationality-input-option-USA"

# Date of Birth (DatePickerField — opens modal)
- scrollUntilVisible:
    element:
      id: "dob-input"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "dob-input"
# Confirm the default date (today) — we accept any valid DOB for testing
- runFlow: pick-date.yaml

# Gender
- scrollUntilVisible:
    element:
      id: "gender-Male-button"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "gender-Male-button"

# Passport expiry (DatePickerField — opens modal)
- scrollUntilVisible:
    element:
      id: "passport-expiry-input"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "passport-expiry-input"
# Confirm the default date — we accept any valid expiry for testing
- runFlow: pick-date.yaml

# Issuing country (searchable dropdown)
- scrollUntilVisible:
    element:
      id: "issuing-country-input"
    direction: DOWN
    timeout: 5000
# Scroll extra so the dropdown options won't be clipped below screen edge
- swipe:
    start: "50%,60%"
    end: "50%,30%"
    duration: 300
- tapOn:
    id: "issuing-country-input-trigger"
# Dropdown opens — type in search field to filter
- extendedWaitUntil:
    visible:
      id: "issuing-country-input-search"
    timeout: 5000
- tapOn:
    id: "issuing-country-input-search"
- eraseText: 20
- inputText: "United States"
- pressKey: Enter
# Scroll to reveal option if below screen edge
- swipe:
    start: "50%,70%"
    end: "50%,50%"
    duration: 200
# Now tap the matching option
- tapOn:
    id: "issuing-country-input-option-USA"

# Extra dismiss before Continue
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

- scrollUntilVisible:
    element:
      id: "passport-continue-button"
    direction: DOWN
- tapOn:
    id: "passport-continue-button"

# === CONFIRM PROFILE SCREEN ===
- extendedWaitUntil:
    visible: "Confirm Your Profile"
    timeout: 30000
- assertVisible: "L12345678"
# Name is shown as combined "JOHN MICHAEL SMITH" on ConfirmProfile
- assertVisible: "JOHN MICHAEL SMITH"

- scrollUntilVisible:
    element:
      id: "continue-to-security-button"
    direction: DOWN
- tapOn:
    id: "continue-to-security-button"

# Retry if button tap didn't register
- runFlow:
    when:
      visible:
        id: "continue-to-security-button"
    commands:
      - tapOn:
          id: "continue-to-security-button"

# === ADD COMPANIONS - SKIP ===
- extendedWaitUntil:
    visible: "Traveling with family?"
    timeout: 15000
- tapOn: "Skip for now"

# === BIOMETRIC SETUP - SKIP ===
- extendedWaitUntil:
    visible: "Secure Your Profile"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "skip-biometric-button"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "skip-biometric-button"
# Alert appears with "Go Back" (cancel) and "Skip" buttons.
# Wait briefly for alert animation, then tap "Skip" to confirm.
- extendedWaitUntil:
    visible: "Skip Biometric Setup?"
    timeout: 5000
- tapOn: "Skip"

# Handle welcome alert if present
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"

# === NOTIFICATION PERMISSION - SKIP (if shown) ===
# This screen auto-skips when notifications are already authorized on the device.
- runFlow:
    when:
      visible: "Stay on Top of Deadlines"
    commands:
      - tapOn:
          id: "skip-notifications-button"

# === MAIN SCREEN ===
# Allow extra time for navigator swap animation (Onboarding → Main)
- extendedWaitUntil:
    visible: "Your Trips"
    timeout: 30000
- assertVisible: "No trips yet"
