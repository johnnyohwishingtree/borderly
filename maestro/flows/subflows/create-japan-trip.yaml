# Shared subflow: Create a Japan trip with full leg details
#
# Usage from any flow:
#   - runFlow: subflows/create-japan-trip.yaml
#
# Precondition: On "Your Trips" screen (no existing trips)
# Postcondition: Trip created, back on "Your Trips" with trip card visible
appId: com.borderly.app
---

- tapOn:
    id: "create-first-trip-button"

- extendedWaitUntil:
    visible: "Create New Trip"
    timeout: 10000

# Dismiss Fast Refresh banner if present
- runFlow:
    when:
      visible: "Dismiss"
    commands:
      - tapOn: "Dismiss"

# Trip name first (at top of screen)
- tapOn:
    id: "trip-name-input"
- inputText: "Smith Family Asia"
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

# Add destination — scroll to button first
- scrollUntilVisible:
    element:
      id: "add-destination-button"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "add-destination-button"

# Select Japan via SearchableSelect
- scrollUntilVisible:
    element:
      id: "country-select-0"
    direction: UP
    timeout: 5000
- tapOn:
    id: "country-select-0-trigger"
- extendedWaitUntil:
    visible:
      id: "country-select-0-search"
    timeout: 5000
- tapOn:
    id: "country-select-0-search"
- eraseText: 20
- inputText: "Japan"
- pressKey: enter
- swipe:
    start: "50%,70%"
    end: "50%,50%"
    duration: 200
- tapOn:
    id: "country-select-0-option-JPN"

# Dismiss any banners
- runFlow:
    when:
      visible: "Fast Refresh disconnected"
    commands:
      - tapOn: "Dismiss"

# Arrival date — scroll UP to find it (date fields are above flight number)
- scrollUntilVisible:
    element:
      id: "leg-0-arrival-date"
    direction: UP
    timeout: 10000
    centerElement: true
- tapOn:
    id: "leg-0-arrival-date"
- extendedWaitUntil:
    visible: "Done"
    timeout: 5000
- tapOn: "Done"

# Departure date (right next to arrival date — may need to scroll up after modal dismiss)
- scrollUntilVisible:
    element:
      id: "leg-0-departure-date"
    direction: UP
    timeout: 5000
    centerElement: true
- tapOn:
    id: "leg-0-departure-date"
- extendedWaitUntil:
    visible: "Done"
    timeout: 5000
- tapOn: "Done"

# Flight number
- scrollUntilVisible:
    element:
      id: "leg-0-flight-number"
    direction: DOWN
    timeout: 5000
    centerElement: true
- tapOn:
    id: "leg-0-flight-number"
- inputText: "NH101"
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

# Airline code
- scrollUntilVisible:
    element:
      id: "leg-0-airline-code"
    direction: DOWN
    timeout: 5000
    centerElement: true
- tapOn:
    id: "leg-0-airline-code"
- inputText: "NH"
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

# Arrival airport — skipped (optional, SearchableSelect needs full interaction)

# Accommodation name
- scrollUntilVisible:
    element:
      id: "leg-0-accommodation-name"
    direction: DOWN
    timeout: 5000
    centerElement: true
- tapOn:
    id: "leg-0-accommodation-name"
- inputText: "Park Hyatt Tokyo"
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

# Accommodation address (AddressAutocomplete sub-fields)
- scrollUntilVisible:
    element:
      id: "leg-0-accommodation-address-line1"
    direction: DOWN
    timeout: 5000
    centerElement: true
- tapOn:
    id: "leg-0-accommodation-address-line1"
- inputText: "3-7-1-2 Nishi Shinjuku"
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

# City
- scrollUntilVisible:
    element:
      id: "leg-0-accommodation-address-city"
    direction: DOWN
    timeout: 5000
    centerElement: true
- tapOn:
    id: "leg-0-accommodation-address-city"
- inputText: "Tokyo"
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

# Postal Code
- scrollUntilVisible:
    element:
      id: "leg-0-accommodation-address-postal-code"
    direction: DOWN
    timeout: 5000
    centerElement: true
- tapOn:
    id: "leg-0-accommodation-address-postal-code"
- inputText: "163-1055"
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

# Country
- scrollUntilVisible:
    element:
      id: "leg-0-accommodation-address-country"
    direction: DOWN
    timeout: 5000
    centerElement: true
- tapOn:
    id: "leg-0-accommodation-address-country"
- inputText: "JPN"

# Dismiss keyboard before scrolling to Create button
- pressKey: Enter
- swipe:
    start: "50%,50%"
    end: "50%,45%"
    duration: 200

# Scroll to Create Trip button
- scrollUntilVisible:
    element:
      id: "create-trip-button"
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    id: "create-trip-button"

# Wait for result — either Success or Validation Error
- extendedWaitUntil:
    visible: "Success"
    timeout: 10000
- tapOn: "OK"

# After success, app navigates to Trip Details
- extendedWaitUntil:
    visible: "Trip Details"
    timeout: 20000
- extendedWaitUntil:
    visible: "Smith Family Asia"
    timeout: 5000
- extendedWaitUntil:
    visible: "Japan"
    timeout: 5000
