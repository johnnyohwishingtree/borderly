# Multi-Country Portal Flow — No-Account Countries
#
# Tests the portal submission flow for Malaysia, Singapore, Vietnam, and Canada.
# These countries don't require portal accounts, so we can navigate through
# onboarding, trip creation, leg form, submission guide, and portal screen
# for each country.
#
# This flow creates a Malaysia trip as the representative case, then verifies
# the full path from trip creation to portal submission screen.
#
# Tags: portal, multi-country, no-account
appId: com.borderly.app
tags:
  - portal
  - multi-country
  - no-account
---

# ============================================================
# PHASE 1: Onboarding
# ============================================================
- launchApp:
    clearState: true

- runFlow: subflows/onboard-primary-user.yaml

# ============================================================
# PHASE 2: Create a trip to Malaysia (no-account country)
# ============================================================

- runFlow: subflows/create-malaysia-trip.yaml

# ============================================================
# PHASE 3: Open trip and navigate to Malaysia leg form
# ============================================================

- tapOn:
    id: "trip-card-Malaysia Trip"

- extendedWaitUntil:
    visible: "Itinerary"
    timeout: 10000
- assertVisible:
    id: "leg-card-MYS"

# Tap Malaysia leg to open the leg form
- tapOn:
    id: "leg-card-MYS"

# ============================================================
# PHASE 4: LegForm — verify auto-fill and fill remaining fields
# ============================================================

- extendedWaitUntil:
    visible: "Travel Form"
    timeout: 15000

- extendedWaitUntil:
    visible: "Form Summary"
    timeout: 10000

# Dismiss Fast Refresh banner if present
- runFlow:
    when:
      visible: "Fast Refresh"
    commands:
      - tapOn: "Dismiss"

# Swipe to reach form fields (past Form Summary)
- swipe:
    start: "50%,70%"
    end: "50%,20%"
    duration: 400
- swipe:
    start: "50%,70%"
    end: "50%,20%"
    duration: 400
- swipe:
    start: "50%,70%"
    end: "50%,20%"
    duration: 400

# Fill country-specific fields that need manual entry
# departureCity — text field with no autoFillSource
- tapOn:
    id: "input-departureCity"
- inputText: "Los Angeles"
- pressKey: Enter
- tapOn: "Travel Form"

# Scroll to hotel phone and fill it
- swipe:
    start: "50%,70%"
    end: "50%,30%"
    duration: 400
- tapOn:
    id: "input-hotelPhone"
- inputText: "+60-3-2380-8888"
- pressKey: Enter
- tapOn: "Travel Form"

# Save progress
- swipe:
    start: "50%,70%"
    end: "50%,10%"
    duration: 400
- swipe:
    start: "50%,70%"
    end: "50%,10%"
    duration: 400
- tapOn:
    id: "save-progress-button"

- extendedWaitUntil:
    visible: "OK"
    timeout: 10000
- tapOn: "OK"

# Mark as Ready
- extendedWaitUntil:
    visible: "Mark as Ready"
    timeout: 10000
- tapOn:
    id: "mark-ready-button"

- extendedWaitUntil:
    visible: "OK"
    timeout: 10000
- tapOn: "OK"

# Verify back on trip detail
- extendedWaitUntil:
    visible: "Itinerary"
    timeout: 10000

# ============================================================
# PHASE 5: Open Submission Guide for Malaysia
# ============================================================

- tapOn:
    id: "leg-card-MYS"

- extendedWaitUntil:
    visible: "Travel Form"
    timeout: 10000

# Scroll to submission guide button
- swipe:
    start: "50%,70%"
    end: "50%,10%"
    duration: 400
- swipe:
    start: "50%,70%"
    end: "50%,10%"
    duration: 400
- swipe:
    start: "50%,70%"
    end: "50%,10%"
    duration: 400
- swipe:
    start: "50%,70%"
    end: "50%,10%"
    duration: 400
- swipe:
    start: "50%,70%"
    end: "50%,10%"
    duration: 400
- tapOn:
    id: "open-submission-guide-button"

# Verify Submission Guide loaded for Malaysia
- extendedWaitUntil:
    visible: "Submission Guide"
    timeout: 15000
- assertVisible: "Submit in App"
- assertVisible: "Submission Timing"

# Take screenshot of Malaysia submission guide
- takeScreenshot: maestro/output/mys-submission-guide

# ============================================================
# PHASE 6: Open Malaysia Portal in-app WebView
# ============================================================

- tapOn:
    id: "submit-in-app-button"

# Verify PortalSubmissionScreen renders
- extendedWaitUntil:
    visible:
      id: "portal-submission-screen"
    timeout: 15000
- assertVisible:
    id: "portal-submission-screen"

# Verify toolbar buttons
- assertVisible:
    id: "toolbar-back-button"
- assertVisible:
    id: "toolbar-forward-button"
- assertVisible:
    id: "toolbar-refresh-button"
- assertVisible:
    id: "close-portal-button"

# Verify the WebView area renders
- assertVisible:
    id: "portal-webview"

# Verify the portal header shows Malaysia portal name
- assertVisible: "Malaysia Digital Arrival Card"

# Take screenshot of portal screen
- takeScreenshot: maestro/output/mys-portal-submission

# Verify fields panel toggle
- extendedWaitUntil:
    visible:
      id: "toggle-fields-panel"
    timeout: 5000
- tapOn:
    id: "toggle-fields-panel"

- extendedWaitUntil:
    visible:
      id: "fields-panel"
    timeout: 5000

# Take screenshot with fields panel open
- takeScreenshot: maestro/output/mys-portal-fields-panel

# ============================================================
# PHASE 7: Close portal and verify navigation
# ============================================================

- tapOn:
    id: "close-portal-button"

- extendedWaitUntil:
    visible: "Itinerary"
    timeout: 10000
- assertVisible: "Itinerary"

- assertNotVisible:
    id: "portal-submission-screen"
