# Family demo scan flow
#
# Onboards primary user with demo scan, then adds spouse and child
# family members via demo scan from the AddCompanions screen.
#
# Tests the full family passport scan workflow without camera.
appId: com.borderly.app
---
- clearState
- launchApp

# === ONBOARD PRIMARY USER ===

# Welcome
- extendedWaitUntil:
    visible: "Borderly"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "take-tutorial-button"
    direction: DOWN
- tapOn:
    id: "take-tutorial-button"

# Tutorial — skip
- extendedWaitUntil:
    visible: "Step 1 of 3"
    timeout: 10000
- tapOn:
    id: "tutorial-skip-button"

# Passport — demo scan adult
- extendedWaitUntil:
    visible: "Passport Information"
    timeout: 15000
- runFlow:
    when:
      visible: "Performance Optimization Enabled"
    commands:
      - tapOn: "Dismiss"
- scrollUntilVisible:
    element:
      id: "demo-scan-adult"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "demo-scan-adult"

# Preview — confirm
- extendedWaitUntil:
    visible: "JOHN MICHAEL SMITH"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "confirm-scan-button"
    direction: DOWN
- tapOn:
    id: "confirm-scan-button"

# Confirm Profile
- extendedWaitUntil:
    visible: "Confirm Your Profile"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "continue-to-security-button"
    direction: DOWN
- tapOn:
    id: "continue-to-security-button"
- runFlow:
    when:
      visible:
        id: "continue-to-security-button"
    commands:
      - tapOn:
          id: "continue-to-security-button"

# === ADD COMPANIONS — ADD SPOUSE ===
- extendedWaitUntil:
    visible: "Traveling with family?"
    timeout: 15000
- tapOn: "Add a travel companion"

# Should navigate to passport scan for family member
- extendedWaitUntil:
    visible: "Passport Information"
    timeout: 15000
- runFlow:
    when:
      visible: "Performance Optimization Enabled"
    commands:
      - tapOn: "Dismiss"

# Demo scan spouse
- scrollUntilVisible:
    element:
      id: "demo-scan-spouse"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "demo-scan-spouse"

# Preview — confirm spouse
- extendedWaitUntil:
    visible: "JANE MARIE SMITH"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "confirm-scan-button"
    direction: DOWN
- tapOn:
    id: "confirm-scan-button"

# Should return to AddCompanions with spouse listed
- extendedWaitUntil:
    visible: "Traveling with family?"
    timeout: 15000

# === ADD CHILD ===
- tapOn: "Add a travel companion"

- extendedWaitUntil:
    visible: "Passport Information"
    timeout: 15000
- runFlow:
    when:
      visible: "Performance Optimization Enabled"
    commands:
      - tapOn: "Dismiss"

# Demo scan child
- scrollUntilVisible:
    element:
      id: "demo-scan-child"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "demo-scan-child"

# Preview — confirm child
- extendedWaitUntil:
    visible: "EMMA SMITH"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "confirm-scan-button"
    direction: DOWN
- tapOn:
    id: "confirm-scan-button"

# Should return to AddCompanions with both family members
- extendedWaitUntil:
    visible: "Traveling with family?"
    timeout: 15000

# Continue to biometric setup
- tapOn: "Continue"

# === BIOMETRIC SETUP - SKIP ===
- extendedWaitUntil:
    visible: "Secure Your Profile"
    timeout: 15000
- tapOn:
    id: "skip-biometric-button"
- extendedWaitUntil:
    visible: "Skip"
    timeout: 5000
- tapOn: "Skip"

# Handle welcome alert
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"

# === MAIN SCREEN ===
- extendedWaitUntil:
    visible: "Your Trips"
    timeout: 15000
