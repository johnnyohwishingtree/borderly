# Full flow: Onboarding + Trip Creation + Form + Submission Guide
# Single user, single country (Japan) - validates the complete happy path
appId: com.borderly.app
tags:
  - trip
  - submission
  - critical
---

# ============================================================
# PHASE 1: Onboarding
# ============================================================
- launchApp:
    clearState: true

- runFlow: subflows/onboard-primary-user.yaml

# ============================================================
# PHASE 2: Create a trip to Japan
# ============================================================

- runFlow: subflows/create-japan-trip.yaml

# ============================================================
# PHASE 3: Open trip and go to leg form
# ============================================================

# After trip creation, app navigates directly to Trip Details
# (no need to tap trip card from list)
- extendedWaitUntil:
    visible: "Itinerary"
    timeout: 10000
- assertVisible:
    id: "leg-card-JPN"

# Tap Japan leg to open form
- tapOn:
    id: "leg-card-JPN"

# ============================================================
# PHASE 4: LegForm - fill remaining fields and mark as ready
# ============================================================
# Most fields are auto-filled from profile/trip data.
# batchAutoFill defaults booleans to false and purposeOfVisit to 'tourism'.
# Only departureCity (text, no autoFillSource) needs manual entry.
# hotelPhone is optional but we fill it for completeness.

# Wait for the Travel Form screen to load
- extendedWaitUntil:
    visible: "Travel Form"
    timeout: 15000

# Wait for form content to render (Form Summary appears first)
- extendedWaitUntil:
    visible: "Form Summary"
    timeout: 10000

# Dismiss Fast Refresh banner if present (may appear with delay)
- runFlow:
    when:
      visible: "Fast Refresh"
    commands:
      - tapOn: "Dismiss"

# Wait for DynamicForm to render (form wrapper is at accessible depth)
- extendedWaitUntil:
    visible:
      id: "dynamic-form"
    timeout: 15000

# NOTE: Form fields are beyond Maestro's XCTest hierarchy traversal depth
# (~36 levels) in the full navigation stack. scrollUntilVisible and text
# matching fail at this depth. We use fixed swipes to scroll, then tapOn
# by testID once the element is in the viewport (tapOn works at any depth).

# Swipe up to scroll past Form Summary to reach form fields
- swipe:
    start: "50%,70%"
    end: "50%,20%"
    duration: 400
- swipe:
    start: "50%,70%"
    end: "50%,20%"
    duration: 400
- swipe:
    start: "50%,70%"
    end: "50%,20%"
    duration: 400

# City of Departure — tap the input field by testID
- tapOn:
    id: "input-departureCity"
- inputText: "Los Angeles"
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

# Scroll down to reach Hotel Phone field in Accommodation section
- swipe:
    start: "50%,70%"
    end: "50%,30%"
    duration: 400

# Hotel Phone — tap by testID
- tapOn:
    id: "input-hotelPhone"
- inputText: "03-5322-1234"

# Dismiss keyboard by tapping the return key then tapping header area
- pressKey: Enter
- tapOn: "Travel Form"

# Save progress — scroll to bottom action buttons
- swipe:
    start: "50%,70%"
    end: "50%,10%"
    duration: 400
- swipe:
    start: "50%,70%"
    end: "50%,10%"
    duration: 400
- tapOn:
    id: "save-progress-button"

# Success alert — tap OK to dismiss
- extendedWaitUntil:
    visible: "OK"
    timeout: 10000
- tapOn: "OK"

# Verify we're still on the form (save succeeded)
- assertVisible: "Travel Form"

