# Full flow: Onboarding + Trip Creation + Form + Submission Guide
# Single user, single country (Japan) - validates the complete happy path
appId: com.borderly.app
tags:
  - trip
  - submission
  - critical
---

# ============================================================
# PHASE 1: Onboarding
# ============================================================
- launchApp:
    clearState: true

- runFlow: subflows/onboard-primary-user.yaml

# ============================================================
# PHASE 2: Create a trip to Japan
# ============================================================

- runFlow: subflows/create-japan-trip.yaml

# ============================================================
# PHASE 3: Open trip and go to leg form
# ============================================================

# Wait for trip list and tap the trip card
- tapOn:
    id: "trip-card-Smith Family Asia"

- extendedWaitUntil:
    visible: "Itinerary"
    timeout: 10000
- assertVisible:
    id: "leg-card-JPN"

# Tap Japan leg to open form
- tapOn:
    id: "leg-card-JPN"

# ============================================================
# PHASE 4: LegForm - fill remaining fields and mark as ready
# ============================================================
# Most fields are auto-filled from profile/trip data.
# batchAutoFill defaults booleans to false and purposeOfVisit to 'tourism'.
# Only departureCity (text, no autoFillSource) needs manual entry.
# hotelPhone is optional but we fill it for completeness.

# Wait for the Travel Form screen to load
- extendedWaitUntil:
    visible: "Travel Form"
    timeout: 15000

# Wait for form content to render (Form Summary appears first)
- extendedWaitUntil:
    visible: "Form Summary"
    timeout: 10000

# Dismiss Fast Refresh banner if present (may appear with delay)
- runFlow:
    when:
      visible: "Fast Refresh"
    commands:
      - tapOn: "Dismiss"

# Scroll past Form Summary to reach actual form fields
- scrollUntilVisible:
    element:
      id: "field-departureCity"
    direction: DOWN
    timeout: 15000

# City of Departure — the only required field without autoFillSource
- tapOn:
    id: "field-departureCity"
- inputText: "Los Angeles"
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

# Hotel Phone — optional but fill for completeness
- scrollUntilVisible:
    element:
      id: "field-hotelPhone"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "field-hotelPhone"
- inputText: "03-5322-1234"

# Dismiss keyboard by tapping the return key then tapping header area
- pressKey: Enter
- tapOn: "Travel Form"

# Save progress
- scrollUntilVisible:
    element:
      id: "save-progress-button"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "save-progress-button"

# Success alert — tap OK to dismiss
- extendedWaitUntil:
    visible: "OK"
    timeout: 10000
- tapOn: "OK"

# Mark as Ready — button is in fixed footer, no scroll needed
- extendedWaitUntil:
    visible: "Mark as Ready"
    timeout: 10000
- tapOn:
    id: "mark-ready-button"

# Success alert — tap OK which navigates back
- extendedWaitUntil:
    visible: "OK"
    timeout: 10000
- tapOn: "OK"

# Verify we're back on the trip detail screen
- extendedWaitUntil:
    visible: "Itinerary"
    timeout: 10000

# ============================================================
# PHASE 5: Open Submission Guide and verify it loads
# ============================================================

# Tap Japan leg again to get back to the form
- tapOn:
    id: "leg-card-JPN"

- extendedWaitUntil:
    visible: "Travel Form"
    timeout: 10000

# Form should be ready — Open Submission Guide button should be visible
- scrollUntilVisible:
    element:
      id: "open-submission-guide-button"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "open-submission-guide-button"

# Verify the submission guide loaded (not stuck on "Loading submission guide...")
- extendedWaitUntil:
    visible: "Submission Guide"
    timeout: 15000
- assertVisible: "Open in Browser"
- assertVisible: "Submission Timing"
- assertVisible: "Submit in App"

# Verify our profile data appears in the traveler label
- assertVisible: "For: JOHN MICHAEL SMITH"

# ============================================================
# PHASE 6: Open Portal in-app WebView and verify it loads
# ============================================================

- tapOn:
    id: "submit-in-app-button"

# Verify PortalSubmissionScreen renders with portal chrome
- extendedWaitUntil:
    visible:
      id: "portal-submission-screen"
    timeout: 15000

# Verify the portal header shows "Visit Japan Web"
- assertVisible: "Visit Japan Web"

# Verify toolbar rendered (back, forward, refresh buttons)
- extendedWaitUntil:
    visible:
      id: "toolbar-back-button"
    timeout: 5000
- assertVisible:
    id: "toolbar-refresh-button"

# Verify step progress is visible
- assertVisible: "Step 1 of 7"

# Wait for portal to load — either the WebView loads content
# or we get the auth banner (VJW requires login), or a load error
# (government portals can be slow/unreliable).
- extendedWaitUntil:
    visible:
      id: "portal-webview"
    timeout: 15000

# VJW requires login — verify auth page detection fires
# The page detection script checks HTML for auth patterns (login, password, etc.)
# and shows the auth banner when detected.
- runFlow:
    when:
      visible:
        id: "auth-page-banner"
    commands:
      - assertVisible: "Log in to continue"

# Verify auto-login banner state is one of the expected states.
# We don't assert which specific banner because it depends on whether
# credentials are stored on the test device.
- runFlow:
    when:
      visible:
        id: "auto-login-progress-banner"
    commands:
      - assertVisible: "Logging in automatically"
- runFlow:
    when:
      visible:
        id: "auto-login-failed-banner"
    commands:
      - assertVisible: "Auto-login failed"

# Check that the fields panel toggle is available (copy-paste fallback)
- extendedWaitUntil:
    visible:
      id: "toggle-fields-panel"
    timeout: 5000
- tapOn:
    id: "toggle-fields-panel"

# Verify the fields panel opens and shows our auto-filled data
- extendedWaitUntil:
    visible:
      id: "fields-panel"
    timeout: 5000

# Close portal and go back to trip
- tapOn:
    id: "close-portal-button"

# Verify we're back on trip detail
- extendedWaitUntil:
    visible: "Itinerary"
    timeout: 10000
