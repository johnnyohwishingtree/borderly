# Capture screenshots of every key screen for visual audit
# Usage: maestro test maestro/flows/capture-screenshots.yaml --output maestro/output/
#
# Screenshots are saved to maestro/output/ and can be fed to /visual-audit
appId: com.borderly.app
tags:
  - screenshots
  - visual-audit
---

# ============================================================
# PHASE 1: Onboarding Screens
# ============================================================
- launchApp:
    clearState: true

# Welcome Screen
- extendedWaitUntil:
    visible: "Borderly"
    timeout: 15000
- takeScreenshot: maestro/output/01-welcome-screen

# Tap through to tutorial
- scrollUntilVisible:
    element:
      id: "take-tutorial-button"
    direction: DOWN
- tapOn:
    id: "take-tutorial-button"

# Tutorial Screen
- extendedWaitUntil:
    visible: "Step 1 of 5"
    timeout: 10000
- takeScreenshot: maestro/output/02-tutorial-screen
- tapOn:
    id: "skip-tutorial-button"

# Passport Scan Screen
- extendedWaitUntil:
    visible: "Passport Information"
    timeout: 15000
- runFlow:
    when:
      visible: "Performance Optimization Enabled"
    commands:
      - tapOn: "Dismiss"
- takeScreenshot: maestro/output/03-passport-scan-screen

# Choose manual entry and fill form
- scrollUntilVisible:
    element:
      id: "enter-manually-button"
    direction: DOWN
- tapOn:
    id: "enter-manually-button"

# Manual Passport Form
- extendedWaitUntil:
    visible:
      id: "passport-number-input"
    timeout: 10000
- takeScreenshot: maestro/output/04-passport-form-top

# Fill passport data
- swipe:
    start: "50%,30%"
    end: "50%,60%"
    duration: 300
- tapOn:
    id: "passport-number-input"
- inputText: "L12345678"
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

- scrollUntilVisible:
    element:
      id: "surname-input"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "surname-input"
- inputText: "SMITH"
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

- scrollUntilVisible:
    element:
      id: "given-names-input"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "given-names-input"
- inputText: "JOHN MICHAEL"
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

# Nationality
- scrollUntilVisible:
    element:
      id: "nationality-input"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "nationality-input-trigger"
- extendedWaitUntil:
    visible:
      id: "nationality-input-search"
    timeout: 5000
- tapOn:
    id: "nationality-input-search"
- inputText: "United States"
- pressKey: Enter
- tapOn:
    id: "nationality-input-option-USA"

# DOB
- scrollUntilVisible:
    element:
      id: "dob-input"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "dob-input"
- inputText: "1985-06-15"
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

# Gender
- scrollUntilVisible:
    element:
      id: "gender-Male-button"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "gender-Male-button"

# Passport expiry
- scrollUntilVisible:
    element:
      id: "passport-expiry-input"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "passport-expiry-input"
- inputText: "2032-03-20"
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200

# Issuing country
- scrollUntilVisible:
    element:
      id: "issuing-country-input"
    direction: DOWN
    timeout: 5000
- swipe:
    start: "50%,60%"
    end: "50%,30%"
    duration: 300
- tapOn:
    id: "issuing-country-input-trigger"
- extendedWaitUntil:
    visible:
      id: "issuing-country-input-search"
    timeout: 5000
- tapOn:
    id: "issuing-country-input-search"
- inputText: "United States"
- pressKey: Enter
- swipe:
    start: "50%,70%"
    end: "50%,50%"
    duration: 200
- tapOn:
    id: "issuing-country-input-option-USA"

# Screenshot of filled form bottom
- takeScreenshot: maestro/output/05-passport-form-filled

# Continue to confirm
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200
- scrollUntilVisible:
    element:
      id: "passport-continue-button"
    direction: DOWN
- tapOn:
    id: "passport-continue-button"

# Confirm Profile Screen
- extendedWaitUntil:
    visible: "Confirm Your Profile"
    timeout: 30000
- takeScreenshot: maestro/output/06-confirm-profile-screen
- scrollUntilVisible:
    element:
      id: "continue-to-security-button"
    direction: DOWN
- tapOn:
    id: "continue-to-security-button"
- runFlow:
    when:
      visible:
        id: "continue-to-security-button"
    commands:
      - tapOn:
          id: "continue-to-security-button"

# Biometric Setup Screen
- extendedWaitUntil:
    visible: "Secure Your Profile"
    timeout: 15000
- takeScreenshot: maestro/output/07-biometric-setup-screen
- tapOn:
    id: "skip-biometric-button"
- extendedWaitUntil:
    visible: "Skip"
    timeout: 5000
- tapOn: "Skip"

# Handle welcome alert
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"

# ============================================================
# PHASE 2: Main Screens (Post-Onboarding)
# ============================================================

# Trip List (Empty State)
- extendedWaitUntil:
    visible: "Your Trips"
    timeout: 15000
- takeScreenshot: maestro/output/08-trip-list-empty

# ============================================================
# PHASE 3: Create Trip Flow
# ============================================================
- runFlow: subflows/create-japan-trip.yaml

# Trip List (With Trip)
- extendedWaitUntil:
    visible: "Your Trips"
    timeout: 10000
- takeScreenshot: maestro/output/09-trip-list-with-trip

# Trip Detail Screen
- tapOn:
    id: "trip-card-Smith Family Asia"
- extendedWaitUntil:
    visible: "Itinerary"
    timeout: 10000
- takeScreenshot: maestro/output/10-trip-detail-screen

# ============================================================
# PHASE 4: Leg Form Screen
# ============================================================
- tapOn:
    id: "leg-card-JPN"
- extendedWaitUntil:
    visible: "Travel Form"
    timeout: 15000
- extendedWaitUntil:
    visible: "Form Summary"
    timeout: 10000
- runFlow:
    when:
      visible: "Fast Refresh"
    commands:
      - tapOn: "Dismiss"
- extendedWaitUntil:
    visible:
      id: "dynamic-form"
    timeout: 15000
- takeScreenshot: maestro/output/11-leg-form-top

# Scroll to middle of form
- swipe:
    start: "50%,70%"
    end: "50%,20%"
    duration: 400
- swipe:
    start: "50%,70%"
    end: "50%,20%"
    duration: 400
- takeScreenshot: maestro/output/12-leg-form-middle

# Scroll to bottom of form
- swipe:
    start: "50%,70%"
    end: "50%,20%"
    duration: 400
- swipe:
    start: "50%,70%"
    end: "50%,20%"
    duration: 400
- takeScreenshot: maestro/output/13-leg-form-bottom

# Fill departureCity and save
- tapOn:
    id: "input-departureCity"
- inputText: "Los Angeles"
- swipe:
    start: "50%,40%"
    end: "50%,35%"
    duration: 200
- swipe:
    start: "50%,70%"
    end: "50%,30%"
    duration: 400
- tapOn:
    id: "input-hotelPhone"
- inputText: "03-5322-1234"
- pressKey: Enter
- tapOn: "Travel Form"

# Save and mark ready
- swipe:
    start: "50%,70%"
    end: "50%,10%"
    duration: 400
- swipe:
    start: "50%,70%"
    end: "50%,10%"
    duration: 400
- tapOn:
    id: "save-progress-button"
- extendedWaitUntil:
    visible: "OK"
    timeout: 10000
- tapOn: "OK"
- tapOn:
    id: "mark-ready-button"
- extendedWaitUntil:
    visible: "OK"
    timeout: 10000
- tapOn: "OK"

# ============================================================
# PHASE 5: Submission Guide
# ============================================================
- extendedWaitUntil:
    visible: "Itinerary"
    timeout: 10000
- tapOn:
    id: "leg-card-JPN"
- extendedWaitUntil:
    visible: "Travel Form"
    timeout: 10000

# Scroll to submission guide button
- swipe:
    start: "50%,70%"
    end: "50%,10%"
    duration: 400
- swipe:
    start: "50%,70%"
    end: "50%,10%"
    duration: 400
- swipe:
    start: "50%,70%"
    end: "50%,10%"
    duration: 400
- swipe:
    start: "50%,70%"
    end: "50%,10%"
    duration: 400
- swipe:
    start: "50%,70%"
    end: "50%,10%"
    duration: 400
- tapOn:
    id: "open-submission-guide-button"

- extendedWaitUntil:
    visible: "Submission Guide"
    timeout: 15000
- takeScreenshot: maestro/output/14-submission-guide

# ============================================================
# PHASE 6: Bottom Tab Screens
# ============================================================

# Navigate back to trips
- tapOn:
    id: "close-portal-button"
    optional: true
- runFlow:
    when:
      notVisible: "Your Trips"
    commands:
      - pressKey: back
      - pressKey: back

# Wallet Tab
- tapOn:
    id: "tab-wallet"
    optional: true
- runFlow:
    when:
      visible: "QR Wallet"
    commands:
      - takeScreenshot: maestro/output/15-wallet-screen

# Profile Tab
- tapOn:
    id: "tab-profile"
    optional: true
- runFlow:
    when:
      visible: "Profile"
    commands:
      - takeScreenshot: maestro/output/16-profile-screen

# Settings Tab
- tapOn:
    id: "tab-settings"
    optional: true
- runFlow:
    when:
      visible: "Settings"
    commands:
      - takeScreenshot: maestro/output/17-settings-screen
